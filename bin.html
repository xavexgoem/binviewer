<!DOCTYPE html>
<head>
<title>LGMD BIN viewer</title>
<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three/build/three.module.js",
      "three/addons/": "https://unpkg.com/three/examples/jsm/",
      "jszip": "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"
		}
	}
</script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
	html, body {
		height: 100%;
		margin: 0;
		padding: 0;
	}
	body {
		background-color: #404040;
	}
	* { 
		font-family: monospace; 
		font-weight: bold; 
		color: #111; 
		margin: 0; padding: 0;
	}
	.main-flex { 
		display: flex; 
		flex-direction: row; 
		align-items: flex-start; 
		justify-content: space-between;
		height: 100vh;
	}
	.viewer { 
		display: flex;
		flex-direction: column;
		flex-grow: 1;
		min-width: 340px;
		align-items: stretch;
		position: relative;
		height: 100vh;
	}
	#viewer {
		display: flex;
		justify-content: center;
		align-items: center;
		position: absolute;
		top: 0;
		left: 0;
		right: 0;
		bottom: 0;
		width: 100%;
		height: 100vh;
	}
	#file-controls-overlay {
		position: absolute;
		top: 10px;
		left: 10px;
		background: #eee;
		padding: 10px;
		/* border: 1px solid #333; */
		z-index: 10;
	}

	#file-selector input {
		background-color: #eee;
	}

	#file-controls-overlay label {
		display: block;
		margin-bottom: 5px;
	}
	#file-controls-overlay input[type="file"] {
		margin-bottom: 10px;
	}
	#model-selector {
		border: 1px solid #999;
		height: 800px;
		overflow-y: auto;
	}

	#model-selector div:nth-child(odd) {
		background-color: #ddd;
	}

	#model-selector div {
		cursor: pointer;
	}

	#model-selector div:hover {
		background-color: #aaf;
	}

	.hoverable:hover {
		background-color: #aaaaff;
	}

	#viewer-control {
		margin-top: 10px;
		z-index: 10;
	}

	#statistics {
		position: absolute;
		color: white;
		min-width: 100px;
		min-height: 100px;
		right: 10px;
		top: 10px;
		z-index: 10;
	}
	#statistics table td {
		color: white;
	}
	#statistics table td:nth-child(even) {
		text-align: right;
	}
</style>
</head>
<body>
<div class="main-flex">
	<div class="viewer">
		<div id="viewer"></div>
		<div id="file-controls-overlay">
			<label>Select files (.bin, textures, .zip):</label>
			<input type="file" id="fileInput" multiple accept=".bin,.jpg,.jpeg,.png,.gif,.dds,.webp,.zip,.crf">
			
			<div id="open-files-header" style="text-align: center; font-size: 12pt;">Models</div>
			<div id="model-selector" style="font-size: 12pt;"></div>
			<div id="viewer-control">
				<label><input type="checkbox" id="toggle-bbox"> Show bounding box</label>
				<label><input type="checkbox" id="toggle-vhots" checked> Show vhots</label>
			</div>
		</div>
		<div id="statistics">
			<div id="statistics-header" style="text-align: center; background-color: #eee;">
				Statistics
			</div>
			<table id="header-stats">
				<tr><td>Name</td><td id="s-name"></td></tr>
				<tr><td>Version</td><td id="s-version"></td></tr>
				<tr><td>Height</td><td id="s-height"></td></tr>
				<tr><td>Width</td><td id="s-width"></td></tr>
				<tr><td>Length</td><td id="s-length"></td></tr>
				<tr><td># Subobjs</td><td id="s-subobjs"></td></tr>
				<tr><td># Polys</td><td id="s-polys"></td></tr>
				<tr><td># Materials</td><td id="s-materials"></td></tr>
				<tr><td># Vhots</td><td id="s-vhots"></td></tr>
			</table>
			<div style="text-align: center; background-color: #eee;">
				Subobjects
			</div>
			<table id="subobj-stats">
			</table>
			<div style="text-align: center; background-color: #eee;">
				Materials
			</div>
			<div id="material-stats">

			</div>
		</div>
	</div>
</div>


<script type="module">
  import * as App from './app.js';

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('fileInput')?.addEventListener('change', App.handleMultipleFileInput);
    window.addEventListener('resize', App.handleResize);

    // Make App globally available
    window.App = App;
  });

  // Load zip file from ?file= URL query parameters
  window.addEventListener('load', () => {
	const params = new URLSearchParams(window.location.search);
	const fileUrl = params.get('file');
	if (fileUrl) {
		fetch(fileUrl)
			.then(response => {
				if (!response.ok) {
					throw new Error(`Network response was not ok: ${response.statusText}`);
				}
				return response.blob();
			})
			.then(blob => {
				App.loadZipFile(blob);
			})
			.catch(error => {
				console.error('Error loading zip file:', error);
			});
	}
  });
  </script>
</body>
</html>
